<!-- Hempy Club owner screen, embedded in Shopify admin (Apps → Hempy Club). Contains no data or secrets:
     everything is loaded from the club-admin API, which only answers with a valid Shopify session token. -->
<script>
  // Diagnostics: tell the server the page started loading (before App Bridge).
  (function () {
    var q = new URLSearchParams(location.search);
    var info = 'host=' + q.has('host') + ' embedded=' + q.get('embedded') + ' top=' + (window.top === window);
    try { navigator.sendBeacon('https://xblhodzcowleloqsveun.supabase.co/functions/v1/club-admin?action=ping&stage=start&info=' + encodeURIComponent(info)); } catch (e) {}
    window.hcPing = function (stage, extra) {
      try { navigator.sendBeacon('https://xblhodzcowleloqsveun.supabase.co/functions/v1/club-admin?action=ping&stage=' + stage + '&info=' + encodeURIComponent(extra || '')); } catch (e) {}
    };
  })();
</script>

<style>
  :root { --green: #47792b; --green-d: #34591f; --soft: #e4ecdc; --beige: #cbb896; --cream: #f6f6f1; --ink: #2f2e2b; --line: #e3e1da; --muted: #6b6a66; --red: #a4561e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: #fff; padding: 8px 16px; border-radius: 99px; font: inherit; font-weight: 600; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .k { color: var(--muted); font-size: 13px; }
  .v { font-size: 28px; font-weight: 800; line-height: 1.2; margin-top: 4px; }
  .v small { font-size: 14px; font-weight: 600; color: var(--muted); }
  .hl { background: var(--soft); border-color: transparent; }
  h2 { font-size: 16px; margin: 24px 0 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #faf9f6; font-size: 12px; color: var(--muted); font-weight: 700; }
  tr.row { cursor: pointer; } tr.row:hover td { background: #faf9f6; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--soft); }
  .pill.bronze { background: #f4e6dc; color: #8a5330; } .pill.silver { background: #e9eef1; color: #55636b; } .pill.gold { background: #f6efd6; color: #8a6c12; }
  .pill.wait { background: #eee; color: var(--muted); }
  input, select { font: inherit; padding: 9px 12px; border: 1px solid #cfccc3; border-radius: 8px; background: #fff; }
  .search { width: 100%; max-width: 420px; }
  button.primary { background: var(--green); color: #fff; border: 0; padding: 9px 18px; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
  button.primary:disabled { opacity: .5; }
  button.link { background: none; border: 0; color: var(--green-d); font: inherit; font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; }
  .plus { color: var(--green); font-weight: 700; } .minus { color: var(--red); font-weight: 700; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .bar { flex: 1; background: var(--green); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .bar span { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); }
  .muted { color: var(--muted); } .err { color: var(--red); }
  .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .rules li { margin-bottom: 4px; }

  /* connections */
  .conn { display: grid; gap: 12px; }
  .conn__head { display: flex; align-items: center; gap: 12px; }
  .conn__logo { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; flex-shrink: 0; }
  .conn__title { flex: 1; min-width: 0; }
  .conn__title b { font-size: 15px; }
  .conn .status { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: #eee; color: var(--muted); white-space: nowrap; }
  .conn .status.on { background: var(--soft); color: var(--green-d); }
  .conn .status.bad { background: #f6e3d6; color: var(--red); }
  .conn__body { margin-top: 12px; }
  .conn__body ul { margin: 6px 0 10px; padding-inline-start: 18px; }
  .conn__key { flex: 1; min-width: 220px; direction: ltr; text-align: left; }
  .conn small.help { display: block; color: var(--muted); margin-top: 6px; }
  .conn .num { width: 70px; }

  /* dashboard v2 */
  .periods { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .pp { border: 1px solid var(--line); background: #fff; padding: 7px 14px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .pp[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .kpi__top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .kpi__v { font-size: 30px; font-weight: 800; margin-top: 6px; line-height: 1.1; }
  .kpi__sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .d { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .d.up { background: #e4f1dc; color: #2f6b1a; } .d.down { background: #f8e4da; color: #a4561e; } .d.flat { background: #eee; color: var(--muted); }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; overflow: hidden; }
  .panel__head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .chart { display: flex; flex-direction: row-reverse; align-items: flex-end; gap: 4px; height: 170px; padding: 24px 16px 8px; }
  .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; min-width: 0; }
  .col__bar { background: var(--green); border-radius: 4px 4px 0 0; position: relative; max-width: 26px; margin: 0 auto; width: 100%; }
  .col__bar i { position: absolute; top: -17px; left: -10px; right: -10px; text-align: center; font-style: normal; font-size: 11px; color: var(--muted); }
  .col__lbl { height: 16px; font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; white-space: nowrap; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list li:last-child { border-bottom: 0; } .list li:hover { background: #faf9f6; }
  .pad { padding: 12px 16px; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; padding: 12px 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; color: var(--muted); }
  .strip b { color: var(--ink); }
  .kpi.skel { height: 104px; background: linear-gradient(90deg, #fff 0%, #f1efe9 50%, #fff 100%); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  .minis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .mini { padding: 12px 16px; border-left: 1px solid var(--line); }
  .mini:last-child { border-left: 0; }
  .mini__v { font-size: 24px; font-weight: 800; margin-top: 4px; }
  .two--flush { gap: 0; margin: 0; }
  .two--flush > div:first-child { border-left: 1px solid var(--line); }
  .panel__sub { padding: 10px 16px; font-size: 12px; font-weight: 700; color: var(--muted); background: #faf9f6; border-bottom: 1px solid var(--line); }
  @media (max-width: 800px) { .minis { grid-template-columns: 1fr 1fr; } .two--flush > div:first-child { border-left: 0; border-bottom: 1px solid var(--line); } }
  .potential { margin-top: 12px; padding: 12px 16px; border-radius: 12px; background: #fbf5e8; border: 1px dashed var(--beige); font-size: 13px; }
  @media (max-width: 800px) { .kpis { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { .detail { grid-template-columns: 1fr; } .v { font-size: 22px; } }
</style>

<body>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="dashboard" aria-selected="true">לוח בקרה</button>
    <button class="tab" role="tab" data-tab="members" aria-selected="false">חברים</button>
    <button class="tab" role="tab" data-tab="connections" aria-selected="false">חיבורים</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">הגדרות</button>
  </div>
  <main id="view"><p class="muted">טוען…</p></main>
</div>
<script>
  // Show any startup error on screen (helps when the page is opened from the Shopify mobile app).
  function hcShowError(msg) {
    if (window.hcPing) hcPing('error', String(msg).slice(0, 250));
    var v = document.getElementById('view');
    if (v) v.innerHTML = '<div class="card"><b>המסך לא נטען</b><p class="err" dir="ltr" style="text-align:left;word-break:break-word">' +
      String(msg).replace(/[<>&]/g, '') + '</p><p class="muted">צלמו את המסך ושלחו לקלוד.</p></div>';
  }
  window.addEventListener('error', function (e) { hcShowError(e.message || e); });
  window.addEventListener('unhandledrejection', function (e) { hcShowError((e.reason && (e.reason.message || e.reason)) || 'unknown'); });
  setTimeout(function () {
    var v = document.getElementById('view');
    if (v && /טוען/.test(v.textContent) && !v.querySelector('.kpi:not(.skel)')) {
      hcShowError('timeout · shopify=' + (typeof shopify) + ' · ua=' + navigator.userAgent.slice(0, 80) + ' · host=' + (new URLSearchParams(location.search).has('host')));
    }
  }, 15000);
</script>
<script>
(function () {
  var API = 'https://xblhodzcowleloqsveun.supabase.co/functions/v1/club-admin';
  var STORE = 'https://admin.shopify.com/store/happy-hempy';
  var TIER = { bronze: 'ארד', silver: 'כסף', gold: 'זהב' };
  var REASON = { join_bonus: 'מתנת הצטרפות', order_earn: 'קנייה', second_order_bonus: 'בונוס קנייה שנייה', tier_upgrade_bonus: 'מתנת דרגה',
    refund: 'החזרה', cancel: 'ביטול', redemption: 'מימוש', redemption_restored: 'קוד שלא נוצל', expiry: 'פג תוקף', manual_adjust: 'עדכון ידני',
    profile_bonus: 'השלמת פרופיל', review: 'ביקורת', referral: 'חבר מביא חבר', instagram: 'אינסטגרם' };
  var view = document.getElementById('view');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nis(n) { return Math.round(Number(n) || 0).toLocaleString('he-IL') + ' ₪'; }
  function num(n) { return (Number(n) || 0).toLocaleString('he-IL'); }
  function day(d) { return d ? new Date(d).toLocaleDateString('he-IL') : '—'; }
  function tierPill(t, joined) { return joined === false ? '<span class="pill wait">עוד לא הצטרף/ה</span>' : '<span class="pill ' + esc(t) + '">' + esc(TIER[t] || t) + '</span>'; }

  async function api(action, params, body) {
    if (typeof shopify === 'undefined' || !shopify.idToken) throw new Error('App Bridge not available (shopify=' + typeof shopify + ')');
    var token = await shopify.idToken();
    if (!window.hcTokenOk && window.hcPing) { window.hcTokenOk = true; hcPing('token-ok'); }
    var qs = new URLSearchParams(Object.assign({ action: action }, params || {})).toString();
    var r = await fetch(API + '?' + qs, {
      method: body ? 'POST' : 'GET',
      headers: Object.assign({ Authorization: 'Bearer ' + token }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    var j = await r.json().catch(function () { return { ok: false, message: 'שגיאה' }; });
    if (!r.ok && !j.message) j.message = 'שגיאה ' + r.status;
    return j;
  }

  function card(k, v, sub, cls) { return '<div class="card ' + (cls || '') + '"><div class="k">' + k + '</div><div class="v">' + v + (sub ? ' <small>' + sub + '</small>' : '') + '</div></div>'; }

  // ---------- dashboard ----------
  var PERIODS = [
    { id: 'today', label: 'היום' }, { id: 'yesterday', label: 'אתמול' },
    { id: '7', label: '7 ימים' }, { id: '30', label: '30 ימים' }, { id: 'all', label: 'מתחילת המועדון' }
  ];
  var period = '7';
  function range(id) {
    var now = new Date(), start = new Date(now); start.setHours(0, 0, 0, 0);
    if (id === 'today') return [start, now];
    if (id === 'yesterday') { var y = new Date(start); y.setDate(y.getDate() - 1); return [y, start]; }
    if (id === '7') { var a = new Date(start); a.setDate(a.getDate() - 6); return [a, now]; }
    if (id === '30') { var b = new Date(start); b.setDate(b.getDate() - 29); return [b, now]; }
    return [new Date('2026-10-22T00:00:00+03:00'), now];
  }
  function delta(cur, prev) {
    if (period === 'all') return '';
    if (!prev && !cur) return '<span class="d flat">—</span>';
    if (!prev) return '<span class="d up">חדש</span>';
    var p = Math.round(((cur - prev) / prev) * 100);
    return '<span class="d ' + (p > 0 ? 'up' : p < 0 ? 'down' : 'flat') + '">' + (p > 0 ? '▲ ' : p < 0 ? '▼ ' : '') + Math.abs(p) + '%</span>';
  }
  function kpi(label, value, d, sub) {
    return '<div class="kpi"><div class="kpi__top"><span class="k">' + label + '</span>' + (d || '') + '</div><div class="kpi__v">' + value + '</div>' +
      (sub ? '<div class="kpi__sub">' + sub + '</div>' : '') + '</div>';
  }
  function chart(daily, key, fmt) {
    var max = Math.max.apply(null, daily.map(function (x) { return Number(x[key]) || 0; }).concat([1]));
    return '<div class="chart">' + daily.map(function (x, i) {
      var v = Number(x[key]) || 0;
      var dd = new Date(x.day + 'T12:00:00');
      var lbl = (i % 5 === 4 || i === daily.length - 1) ? dd.getDate() + '.' + (dd.getMonth() + 1) : '';
      return '<div class="col" title="' + dd.toLocaleDateString('he-IL') + ': ' + fmt(v) + '"><div class="col__bar" style="height:' + Math.max(2, Math.round((v / max) * 100)) + '%">' +
        (v ? '<i>' + (key === 'revenue' ? Math.round(v) : v) + '</i>' : '') + '</div><div class="col__lbl">' + lbl + '</div></div>';
    }).join('') + '</div>';
  }
  var chartKey = 'joined';
  var dashSeq = 0;

  async function dashboard() {
    var pills = '<div class="periods">' + PERIODS.map(function (p) {
      return '<button class="pp" data-p="' + p.id + '" aria-pressed="' + (p.id === period) + '">' + p.label + '</button>';
    }).join('') + '</div>';
    view.innerHTML = pills + '<div class="kpis">' + [1, 2, 3, 4].map(function () { return '<div class="kpi skel"></div>'; }).join('') + '</div>';
    bindPeriods();
    var my = ++dashSeq;
    var rg = range(period);
    var r = await api('stats', { from: rg[0].toISOString(), to: rg[1].toISOString() });
    if (my !== dashSeq) return; // a newer period was picked while this one loaded
    if (!r.ok) { view.innerHTML = pills + '<p class="err">' + esc(r.message) + '</p>'; bindPeriods(); return; }
    var c = r.stats.current, p = r.stats.previous, t = r.stats.totals, tiers = t.tiers || {};
    var aov = c.orders ? c.revenue / c.orders : 0;
    var roi = c.redeemed ? c.revenue / c.redeemed : 0;
    var rate = c.earned ? Math.round((c.redeemed / c.earned) * 100) : 0;
    view.innerHTML = pills +
      '<div class="kpis">' +
        kpi('הצטרפו למועדון', num(c.joined), delta(c.joined, p.joined), 'סה״כ ' + num(t.members) + ' חברים') +
        kpi('הכנסה מחברי מועדון', nis(c.revenue), delta(c.revenue, p.revenue), num(c.orders) + ' הזמנות · ממוצע ' + nis(aov)) +
        kpi('נקודות שמומשו', nis(c.redeemed), delta(c.redeemed, p.redeemed), num(c.redemptions) + ' הזמנות עם נקודות') +
        kpi('החזר על כל ₪ הנחה', roi ? roi.toFixed(1) + ' ₪' : '—', '', 'הכנסה מחברים ÷ נקודות שמומשו') +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel__head"><b>30 הימים האחרונים</b><div class="seg">' +
          '<button data-c="joined" aria-pressed="' + (chartKey === 'joined') + '">הצטרפויות</button>' +
          '<button data-c="revenue" aria-pressed="' + (chartKey === 'revenue') + '">הכנסה מחברים</button></div></div>' +
        chart(r.stats.daily, chartKey, chartKey === 'revenue' ? nis : num) +
      '</div>' +
      '<div class="two">' +
        '<div class="panel"><div class="panel__head"><b>הצטרפו לאחרונה</b></div>' +
          (r.stats.recent_joins.length ? '<ul class="list">' + r.stats.recent_joins.map(function (m) {
            return '<li class="row" data-id="' + esc(m.id) + '"><span><b>' + esc(((m.first_name || '') + ' ' + (m.last_name || '')).trim()) + '</b> ' + tierPill(m.tier) +
              '</span><span class="muted">' + when(m.joined_at) + ' · ' + nis(m.balance) + '</span></li>';
          }).join('') + '</ul>' : '<p class="muted pad">עוד אין.</p>') + '</div>' +
        '<div class="panel"><div class="panel__head"><b>מימושים אחרונים</b></div>' +
          (r.stats.recent_redemptions.length ? '<ul class="list">' + r.stats.recent_redemptions.map(function (x) {
            return '<li class="row" data-id="' + esc(x.id) + '"><span><b>' + esc(((x.first_name || '') + ' ' + (x.last_name || '')).trim()) + '</b> <span class="muted">' + esc(x.order_name || '') +
              '</span></span><span><span class="minus">−' + nis(x.points) + '</span>' + (x.order_total ? ' <span class="muted">מתוך ' + nis(x.order_total) + '</span>' : '') + '</span></li>';
          }).join('') + '</ul>' : '<p class="muted pad">עוד לא מומשו נקודות.</p>') + '</div>' +
      '</div>' +
      referralPanel(r.stats.referrals || {}) +
      '<div class="strip">' +
        '<span>יתרות פתוחות של חברים: <b>' + nis(t.balance_members) + '</b></span>' +
        '<span>קודים פעילים: <b>' + num(t.codes_active) + '</b></span>' +
        '<span>דרגות: <b>' + num(tiers.bronze || 0) + '</b> ארד · <b>' + num(tiers.silver || 0) + '</b> כסף · <b>' + num(tiers.gold || 0) + '</b> זהב</span>' +
        '<span>אחוז מימוש: <b>' + rate + '%</b></span>' +
      '</div>' +
      '<div class="potential"><b>💡 פוטנציאל:</b> ' + num(t.pending_buyers) + ' לקוחות מהעבר עוד לא הצטרפו, ויש להם ' + nis(t.balance_pending) + ' בנקודות שמחכות. כל אחד מהם הוא סיבה לקמפיין.</div>';
    bindPeriods();
    view.querySelectorAll('[data-c]').forEach(function (b) { b.onclick = function () { chartKey = b.getAttribute('data-c'); dashboard(); }; });
    bindRows();
  }
  function referralPanel(rf) {
    var SRC = { whatsapp: '💬 וואטסאפ', copy: '🔗 קישור' };
    var mini = function (k, v, sub) { return '<div class="mini"><div class="k">' + k + '</div><div class="mini__v">' + v + '</div>' + (sub ? '<div class="kpi__sub">' + sub + '</div>' : '') + '</div>'; };
    return '<div class="panel"><div class="panel__head"><b>🎁 חבר מביא חבר</b><span class="muted">בתקופה שנבחרה</span></div>' +
      '<div class="minis">' +
        mini('שיתופים בוואטסאפ', num(rf.shares_whatsapp), num(rf.sharers) + ' חברים שיתפו') +
        mini('העתקות קישור', num(rf.shares_copy)) +
        mini('חברים שהצטרפו דרך חבר', num(rf.joined), 'מוואטסאפ ' + num(rf.joined_whatsapp) + ' · מקישור ' + num(rf.joined_copy)) +
        mini('חברים חדשים שקנו', num(rf.bought), 'מי שהזמין קיבל 20 ₪') +
      '</div>' +
      '<div class="two two--flush">' +
        '<div><div class="panel__sub">הצטרפו דרך חבר</div>' +
          ((rf.recent || []).length ? '<ul class="list">' + rf.recent.map(function (x) {
            return '<li class="row" data-id="' + esc(x.friend_id) + '"><span><b>' + esc(x.friend || 'חבר/ה') + '</b> <span class="muted">דרך ' + esc(x.referrer || '') + '</span></span>' +
              '<span class="muted">' + (SRC[x.source] || 'לא ידוע') + ' · ' + (x.status === 'rewarded' ? '<span class="plus">קנה/תה ✓</span>' : 'עוד לא קנה/תה') + '</span></li>';
          }).join('') + '</ul>' : '<p class="muted pad">עוד אף אחד לא הצטרף דרך חבר.</p>') + '</div>' +
        '<div><div class="panel__sub">משתפים מובילים</div>' +
          ((rf.top_sharers || []).length ? '<ul class="list">' + rf.top_sharers.map(function (x) {
            return '<li class="row" data-id="' + esc(x.id) + '"><span><b>' + esc(x.name || '') + '</b></span><span class="muted">' + x.n + ' שיתופים · ' + x.friends + ' הצטרפו</span></li>';
          }).join('') + '</ul>' : '<p class="muted pad">עוד אין שיתופים בתקופה הזו.</p>') + '</div>' +
      '</div></div>';
  }
  function bindPeriods() {
    view.querySelectorAll('.pp').forEach(function (b) { b.onclick = function () { period = b.getAttribute('data-p'); dashboard(); }; });
  }
  function when(d) {
    var x = new Date(d), today = new Date(); today.setHours(0, 0, 0, 0);
    var hm = x.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    if (x >= today) return 'היום ' + hm;
    var y = new Date(today); y.setDate(y.getDate() - 1);
    if (x >= y) return 'אתמול ' + hm;
    return x.toLocaleDateString('he-IL');
  }

  // ---------- members ----------
  var searchTimer;
  function membersView(q) {
    view.innerHTML = '<input class="search" type="search" placeholder="חיפוש לפי שם, מייל או טלפון" value="' + esc(q || '') + '" autofocus>' +
      '<p class="muted" style="margin:8px 0 12px">בלי חיפוש מוצגים חברי המועדון האחרונים. החיפוש כולל גם קונים שעוד לא הצטרפו.</p><div id="list"></div>';
    var input = view.querySelector('input');
    input.addEventListener('input', function () { clearTimeout(searchTimer); searchTimer = setTimeout(function () { loadMembers(input.value); }, 300); });
    loadMembers(q || '');
  }
  async function loadMembers(q) {
    var list = document.getElementById('list');
    list.innerHTML = '<p class="muted">טוען…</p>';
    var r = await api('members', { q: q });
    if (!r.ok) { list.innerHTML = '<p class="err">' + esc(r.message) + '</p>'; return; }
    if (!r.members.length) { list.innerHTML = '<p class="muted">לא נמצאו תוצאות.</p>'; return; }
    list.innerHTML = '<table><thead><tr><th>שם</th><th>מייל</th><th>טלפון</th><th>סטטוס</th><th>יתרה</th><th>קנייה אחרונה</th></tr></thead><tbody>' +
      r.members.map(function (m) {
        return '<tr class="row" data-id="' + esc(m.id) + '"><td>' + esc((m.first_name || '') + ' ' + (m.last_name || '')) + '</td><td>' + esc(m.email || '') +
          '</td><td dir="ltr" style="text-align:right">' + esc(m.phone || '') + '</td><td>' + tierPill(m.tier, m.joined) + '</td><td>' + nis(m.balance) + '</td><td>' + day(m.last_order_at) + '</td></tr>';
      }).join('') + '</tbody></table>';
    bindRows();
  }
  function bindRows() {
    view.querySelectorAll('.row').forEach(function (tr) { tr.onclick = function () { memberDetail(tr.getAttribute('data-id')); }; });
  }

  async function memberDetail(id) {
    select('members', true);
    view.innerHTML = '<p class="muted">טוען…</p>';
    var r = await api('member', { id: id });
    if (!r.ok) { view.innerHTML = '<p class="err">' + esc(r.message) + '</p>'; return; }
    var m = r.member;
    var gender = { female: 'נקבה', male: 'זכר', other: 'אחר' }[m.gender] || '—';
    view.innerHTML =
      '<p><button class="link" data-back>→ חזרה לרשימה</button></p>' +
      '<div class="detail">' +
        '<div class="card"><div class="k">' + tierPill(m.tier, m.joined) + '</div>' +
          '<div class="v">' + esc((m.first_name || '') + ' ' + (m.last_name || '')) + '</div>' +
          '<p>' + esc(m.email || '') + (m.phone ? ' · <span dir="ltr">' + esc(m.phone) + '</span>' : '') + '</p>' +
          '<p class="muted">עיר: ' + esc(m.region || '—') + ' · מגדר: ' + gender + ' · תאריך לידה: ' + day(m.birthday) + '</p>' +
          '<p class="muted">הצטרפות: ' + day(m.joined_at) + ' · קנייה אחרונה: ' + day(m.last_order_at) + '</p>' +
          '<p><a href="' + STORE + '/customers/' + esc(m.shopify_customer_id) + '" target="_top">לכרטיס הלקוח ב-Shopify</a></p></div>' +
        '<div class="card hl"><div class="k">יתרה</div><div class="v">' + nis(r.balance) + '</div>' +
          '<div class="row-form"><select data-sign><option value="1">הוספה</option><option value="-1">הורדה</option></select>' +
          '<input type="number" min="1" max="1000" placeholder="סכום ₪" style="width:110px" data-amount>' +
          '<input type="text" maxlength="120" placeholder="סיבה (למשל: פיצוי על עיכוב)" style="flex:1;min-width:180px" data-note>' +
          '<button class="primary" data-adjust>שמירה</button></div><p data-out class="muted"></p></div>' +
      '</div>' +
      '<h2>תנועות נקודות</h2>' +
      (r.ledger.length
        ? '<table><thead><tr><th>תאריך</th><th>סוג</th><th>פרטים</th><th>₪</th></tr></thead><tbody>' +
          r.ledger.map(function (l) {
            return '<tr><td>' + day(l.created_at) + '</td><td>' + esc(REASON[l.reason] || l.reason) + '</td><td>' + esc(l.note || '') +
              '</td><td class="' + (l.delta > 0 ? 'plus' : 'minus') + '">' + (l.delta > 0 ? '+' : '') + l.delta + '</td></tr>';
          }).join('') + '</tbody></table>'
        : '<p class="muted">אין תנועות.</p>') +
      '<h2>הזמנות</h2>' +
      (r.orders.length
        ? '<table><thead><tr><th>הזמנה</th><th>תאריך</th><th>סכום</th><th>נקודות</th><th>סטטוס</th></tr></thead><tbody>' +
          r.orders.map(function (o) {
            var st = { paid: 'שולמה', refunded: 'הוחזרה', cancelled: 'בוטלה' }[o.status] || o.status;
            return '<tr><td>' + esc(o.order_name || '') + '</td><td>' + day(o.paid_at) + '</td><td>' + nis(o.eligible_amount - o.refunded_amount) + '</td><td>' + o.points_awarded + '</td><td>' + st + '</td></tr>';
          }).join('') + '</tbody></table>'
        : '<p class="muted">אין הזמנות.</p>');
    view.querySelector('[data-back]').onclick = function () { membersView(''); };
    var btn = view.querySelector('[data-adjust]');
    btn.onclick = async function () {
      var out = view.querySelector('[data-out]');
      var amount = Math.trunc(Number(view.querySelector('[data-amount]').value));
      var delta = amount * Number(view.querySelector('[data-sign]').value);
      var note = view.querySelector('[data-note]').value.trim();
      if (!amount || amount < 1) { out.textContent = 'נא לכתוב סכום'; return; }
      if (!note) { out.textContent = 'נא לכתוב סיבה'; return; }
      if (!confirm((delta > 0 ? 'להוסיף ' : 'להוריד ') + Math.abs(delta) + ' ₪ ל' + ((m.first_name || '') + ' ' + (m.last_name || '')).trim() + '?')) return;
      btn.disabled = true;
      var res = await api('adjust', {}, { member_id: m.id, delta: delta, note: note });
      btn.disabled = false;
      if (!res.ok) { out.textContent = res.message || 'שגיאה'; return; }
      shopify.toast.show('היתרה עודכנה');
      memberDetail(m.id);
    };
  }

  // ---------- settings ----------
  async function settings() {
    view.innerHTML = '<p class="muted">טוען…</p>';
    var r = await api('settings');
    if (!r.ok) { view.innerHTML = '<p class="err">' + esc(r.message) + '</p>'; return; }
    var s = r.settings || {};
    view.innerHTML =
      '<div class="card switch"><div><b>פרסום אוטומטי בטלגרם</b><div class="muted">כשמוצר שאזל חוזר למלאי, הבוט מפרסם בערוץ t.me/happyhempy (פוסט אחד למוצר ביום).</div></div>' +
      '<label><input type="checkbox" data-tg ' + (s.telegram_restock === true ? 'checked' : '') + '> ' + (s.telegram_restock === true ? 'פעיל' : 'כבוי') + '</label></div>' +
      '<h2>כללי המועדון</h2><div class="card"><ul class="rules">' +
        '<li>מתנת הצטרפות: <b>20 ₪</b>, זמינה מיד, בתוקף 60 יום מההצטרפות.</li>' +
        '<li>צבירה: ארד 5 ₪ · כסף 7 ₪ · זהב 10 ₪ על כל 100 ₪. קנייה שנייה תוך 60 יום: כפול.</li>' +
        '<li>דרגות: כסף מ-5 קניות או 400 ₪ בשנה · זהב מ-8 קניות או 700 ₪ בשנה.</li>' +
        '<li>מימוש: מ-5 ₪, עד 30% מההזמנה, לא יחד עם קופון. נקודות פגות אחרי 18 חודשים בלי קנייה.</li>' +
        '<li>משלוח חינם: כולם מעל 230 ₪ · כסף מעל 150 ₪ · זהב מעל 100 ₪.</li>' +
        '<li>יום הולדת: 10% / 15% / 20% פעם בשנה, בחודש יום ההולדת.</li>' +
      '</ul><p class="muted">לשינוי הכללים פונים לקלוד.</p></div>' +
      '<h2>קישורים</h2><div class="card"><p><a href="https://www.happy-hempy.com/pages/hempy-club" target="_blank">דף המועדון באתר</a> · ' +
      '<a href="https://www.happy-hempy.com/pages/hempy-club-terms" target="_blank">התקנון</a> · ' +
      '<a href="https://supabase.com/dashboard/project/xblhodzcowleloqsveun/editor" target="_blank">כל הנתונים ב-Supabase</a></p>' +
      (s.test_mode === true ? '<p class="err">שימו לב: מצב בדיקה פעיל.</p>' : '') + '</div>';
    var tg = view.querySelector('[data-tg]');
    tg.onchange = async function () {
      var want = tg.checked;
      if (!confirm(want ? 'להפעיל פרסום אוטומטי של חידושי מלאי בערוץ הטלגרם?' : 'לכבות את הפרסום האוטומטי בטלגרם?')) { tg.checked = !want; return; }
      var res = await api('settings', {}, { telegram_restock: want });
      if (!res.ok) { shopify.toast.show('שגיאה', { isError: true }); tg.checked = !want; return; }
      shopify.toast.show(want ? 'הפרסום בטלגרם הופעל' : 'הפרסום בטלגרם כובה');
      settings();
    };
  }

  // ---------- connections (Klaviyo / Judge.me / Flashy) ----------
  var TOOLS = {
    klaviyo: { name: 'Klaviyo', color: '#232426', letter: 'K', label: 'Private API Key',
      help: 'ב-Klaviyo: Settings ← API keys ← Create Private API Key. הרשאות: Accounts (Read), Profiles (Full), Events (Full). המפתח מתחיל ב-pk_.',
      does: ['כל חבר מקבל בפרופיל: Club Points Balance, Club Tier, Club Referral URL, Club Points Expire At', 'אירועים לזרימות: Club Joined · Club Points Earned · Club Points Redeemed · Club Tier Achieved · Club Referral Completed · Club Points Expired', 'בחיבור הראשון כל החברים הקיימים נשלחים'] },
    flashy: { name: 'Flashy', color: '#ff3d71', letter: 'F', label: 'API Key',
      help: 'ב-Flashy: הגדרות ← API ← העתקת מפתח ה-API.',
      does: ['כל חבר מתעדכן באנשי הקשר: club_points, club_tier, club_referral_url, club_points_expire, club_member', 'אירועים לאוטומציות: ClubJoined · ClubPointsEarned · ClubTierAchieved ועוד', 'בחיבור הראשון כל החברים הקיימים נשלחים'] },
    judgeme: { name: 'Judge.me', color: '#1fa9a1', letter: 'J', label: 'Private API Token',
      help: 'ב-Judge.me: Settings ← Integrations ← View API tokens ← Private API Token.',
      does: ['חבר מועדון שכותב ביקורת מקבל נקודות (פעם אחת לכל מוצר)', 'ביקורת עם תמונה מקבלת תוספת', 'רק ביקורות שנכתבו אחרי החיבור. הנקודות לא תלויות בציון (כמו שהחוק דורש)'] }
  };
  async function connections() {
    view.innerHTML = '<p class="muted">טוען…</p>';
    var r = await api('integrations');
    if (!r.ok) { view.innerHTML = '<p class="err">' + esc(r.message) + '</p>'; return; }
    renderConnections(r.integrations || []);
  }
  function renderConnections(list) {
    view.innerHTML = '<p class="muted" style="margin-top:0">מחברים את מערכות השיווק שלכם, והמועדון מעדכן אותן לבד. המפתחות נשמרים בשרת ולא מוצגים שוב.</p><div class="conn">' +
      list.map(function (x) {
        var t = TOOLS[x.provider];
        var status = !x.connected ? '<span class="status">לא מחובר</span>'
          : x.last_error ? '<span class="status bad">שגיאה</span>' : '<span class="status on">מחובר</span>';
        var body;
        if (!x.connected) {
          body = '<ul>' + t.does.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>' +
            '<div class="row-form"><input class="conn__key" type="password" autocomplete="off" spellcheck="false" placeholder="' + esc(t.label) + '" data-key>' +
            (x.provider === 'judgeme' ? reviewInputs(x.settings) : '') +
            '<button class="primary" data-connect>חיבור</button></div><small class="help">' + esc(t.help) + '</small>';
        } else {
          body = '<div class="muted">חשבון: <b>' + esc(x.account || t.name) + '</b> · מפתח ' + esc(x.key_hint || '') + ' · חובר ב-' + day(x.connected_at) +
            (x.last_ok_at ? ' · עדכון אחרון ' + new Date(x.last_ok_at).toLocaleString('he-IL') : '') + '</div>' +
            (x.last_error ? '<p class="err" dir="ltr" style="text-align:left">' + esc(x.last_error) + '</p>' : '') +
            (x.provider === 'judgeme'
              ? '<p>ביקורות שזיכו נקודות: <b>' + num(x.reviews_rewarded) + '</b> · סה״כ ' + nis(x.review_points_given) + '</p>' +
                '<div class="row-form">' + reviewInputs(x.settings) + '<button class="primary" data-save>שמירה</button></div>'
              : (x.events_waiting ? '<p class="muted">אירועים בתור לשליחה: ' + num(x.events_waiting) + '</p>' : '')) +
            '<div class="row-form"><button class="link" data-disconnect>ניתוק</button></div>';
        }
        return '<div class="card" data-provider="' + x.provider + '"><div class="conn__head"><div class="conn__logo" style="background:' + t.color + '">' + t.letter +
          '</div><div class="conn__title"><b>' + t.name + '</b></div>' + status + '</div><div class="conn__body">' + body + '</div></div>';
      }).join('') + '</div>';
    view.querySelectorAll('[data-provider]').forEach(function (el) {
      var provider = el.getAttribute('data-provider');
      var name = TOOLS[provider].name;
      function reviewSettings() {
        var a = el.querySelector('[data-rp]'), b = el.querySelector('[data-pp]');
        return a ? { review_points: Number(a.value), photo_points: Number(b.value) } : undefined;
      }
      var c = el.querySelector('[data-connect]');
      if (c) c.onclick = async function () {
        var key = el.querySelector('[data-key]').value.trim();
        if (!key) { shopify.toast.show('נא להדביק את המפתח', { isError: true }); return; }
        c.disabled = true; c.textContent = 'בודק…';
        var res = await api('integration_connect', {}, { provider: provider, key: key, settings: reviewSettings() });
        if (!res.ok) { c.disabled = false; c.textContent = 'חיבור'; shopify.toast.show(res.message || 'החיבור נכשל', { isError: true }); return; }
        shopify.toast.show(name + ' חובר');
        renderConnections(res.integrations);
      };
      var s = el.querySelector('[data-save]');
      if (s) s.onclick = async function () {
        var res = await api('integration_settings', {}, { provider: provider, settings: reviewSettings() });
        if (!res.ok) { shopify.toast.show('שגיאה', { isError: true }); return; }
        shopify.toast.show('נשמר');
        renderConnections(res.integrations);
      };
      var d = el.querySelector('[data-disconnect]');
      if (d) d.onclick = async function () {
        if (!confirm('לנתק את ' + name + '? המועדון יפסיק לעדכן אותו.')) return;
        var res = await api('integration_disconnect', {}, { provider: provider });
        if (!res.ok) { shopify.toast.show('שגיאה', { isError: true }); return; }
        shopify.toast.show(name + ' נותק');
        renderConnections(res.integrations);
      };
    });
  }
  function reviewInputs(s) {
    s = s || {};
    return '<label>נקודות לביקורת <input class="num" type="number" min="0" max="100" data-rp value="' + esc(s.review_points == null ? 5 : s.review_points) + '"></label>' +
      '<label>תוספת לתמונה <input class="num" type="number" min="0" max="100" data-pp value="' + esc(s.photo_points == null ? 5 : s.photo_points) + '"></label>';
  }

  // ---------- tabs ----------
  function select(tab, silent) {
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    if (silent) return;
    if (tab === 'dashboard') dashboard();
    else if (tab === 'members') membersView('');
    else if (tab === 'connections') connections();
    else settings();
  }
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { select(b.getAttribute('data-tab')); }; });
  dashboard();
})();
</script>
</body>
</html>
