<title>מועדון החברים – ניהול</title>
<!-- Hempy Club owner screen, embedded in Shopify admin (Apps → Hempy Club). Contains no data or secrets:
     everything is loaded from the club-admin API, which only answers with a valid Shopify session token. -->
<script>
  // Diagnostics: tell the server the page started loading.
  (function () {
    var q = new URLSearchParams(location.search);
    var info = 'host=' + q.has('host') + ' embedded=' + q.get('embedded') + ' top=' + (window.top === window);
    try { navigator.sendBeacon('https://xblhodzcowleloqsveun.supabase.co/functions/v1/club-admin?action=ping&stage=start&info=' + encodeURIComponent(info)); } catch (e) {}
    window.hcPing = function (stage, extra) {
      try { navigator.sendBeacon('https://xblhodzcowleloqsveun.supabase.co/functions/v1/club-admin?action=ping&stage=' + stage + '&info=' + encodeURIComponent(extra || '')); } catch (e) {}
    };
  })();
</script>
<style>
  :root { --green: #47792b; --green-d: #34591f; --soft: #e4ecdc; --beige: #cbb896; --cream: #f6f6f1; --ink: #2f2e2b; --line: #e3e1da; --muted: #6b6a66; --red: #a4561e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: #fff; padding: 8px 16px; border-radius: 99px; font: inherit; font-weight: 600; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .k { color: var(--muted); font-size: 13px; }
  .v { font-size: 28px; font-weight: 800; line-height: 1.2; margin-top: 4px; }
  .v small { font-size: 14px; font-weight: 600; color: var(--muted); }
  .hl { background: var(--soft); border-color: transparent; }
  h2 { font-size: 16px; margin: 24px 0 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #faf9f6; font-size: 12px; color: var(--muted); font-weight: 700; }
  tr.row { cursor: pointer; } tr.row:hover td { background: #faf9f6; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--soft); }
  .pill.bronze { background: #f4e6dc; color: #8a5330; } .pill.silver { background: #e9eef1; color: #55636b; } .pill.gold { background: #f6efd6; color: #8a6c12; } .pill.platinum { background: #e8e6f3; color: #4b3f8f; }
  .pill.wait { background: #eee; color: var(--muted); }
  input, select { font: inherit; padding: 9px 12px; border: 1px solid #cfccc3; border-radius: 8px; background: #fff; }
  .search { width: 100%; max-width: 420px; }
  button.primary { background: var(--green); color: #fff; border: 0; padding: 9px 18px; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
  button.primary:disabled { opacity: .5; }
  button.link { background: none; border: 0; color: var(--green-d); font: inherit; font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; }
  .plus { color: var(--green); font-weight: 700; } .minus { color: var(--red); font-weight: 700; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .bar { flex: 1; background: var(--green); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .bar span { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); }
  .muted { color: var(--muted); } .err { color: var(--red); }
  .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .rules li { margin-bottom: 4px; }

  /* members */
  .mbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .mbar .search { flex: 1; min-width: 220px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--green); color: #fff; border-color: var(--green); }
  .msum { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .msum b { color: var(--ink); }
  .tablewrap { overflow-x: auto; border-radius: 12px; }
  .mtable { min-width: 860px; }
  .mtable td { white-space: nowrap; }
  .mtable .sub { color: var(--muted); font-size: 12px; font-weight: 400; }
  button.sort { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0; font-weight: 700; }
  button.sort.on { color: var(--green-d); }
  .pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 10px; }
  .cust__head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; }
  .cust__head .tab { text-decoration: none; color: var(--ink); }

  .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; flex-shrink: 0; }
  .pb { margin-top: 10px; }
  .pb__top { display: flex; justify-content: space-between; font-size: 13px; }
  .pb__track { height: 8px; background: #eee; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .pb__track i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
  @media (max-width: 700px) { .detail { grid-template-columns: 1fr; } }

  /* program */
  .tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .tpl { text-align: right; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 14px; font: inherit; cursor: pointer; }
  .tpl b { display: block; font-size: 15px; margin-bottom: 4px; }
  .tpl span { color: var(--muted); font-size: 13px; }

  .pf .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

  .pf .off { opacity: .45; pointer-events: none; }

  .savebar { position: sticky; bottom: 0; background: var(--cream); padding: 12px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 16px; }
  @media (max-width: 700px) { .pf .tierrow { grid-template-columns: 60px repeat(5, 1fr); font-size: 12px; } }

  /* campaigns & design */

  .camp { display: grid; gap: 10px; }
  .camp__row { display: grid; grid-template-columns: 1.4fr .6fr 1fr 1fr auto; gap: 10px; align-items: end; }
  .camp__row label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .camp__row input { width: 100%; }
  .camp__state { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: #eee; color: var(--muted); white-space: nowrap; }
  .camp__state.on { background: var(--soft); color: var(--green-d); }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .design { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
  .design .fields { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; }
  .design label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .design input[type="color"] { width: 64px; height: 38px; padding: 2px; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
  .icons { display: flex; gap: 6px; flex-wrap: wrap; }
  .icons button { font-size: 20px; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .icons button[aria-pressed="true"] { border-color: var(--green); background: var(--soft); }
  .pv { position: sticky; top: 12px; background: #f2efe8; border-radius: 16px; padding: 14px; min-height: 420px; overflow: hidden; }
  .pv__site { background: #fff; border-radius: 12px; padding: 14px; font-size: 13px; position: relative; min-height: 390px; }
  .pv__bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .pv__badge, .pv__btn, .pv__fab, .pv__earn { font-weight: 700; }
  .pv__badge { padding: 4px 10px; font-size: 12px; }
  .pv__prod { display: grid; gap: 8px; }
  .pv__img { height: 110px; border-radius: 10px; background: linear-gradient(135deg, #e8e2d6, #d9d1c0); }
  .pv__earn { border-radius: 10px; padding: 8px 10px; font-weight: 400; }
  .pv__btn { text-align: center; padding: 10px; }
  .pv__fab { position: absolute; bottom: 14px; padding: 10px 16px; box-shadow: 0 6px 16px rgba(0,0,0,.2); }
  @media (max-width: 900px) { .design { grid-template-columns: 1fr; } .camp__row { grid-template-columns: 1fr 1fr; } }

  /* connections */
  .conn { display: grid; gap: 12px; }
  .conn__head { display: flex; align-items: center; gap: 12px; }
  .conn__logo { width: 40px; height: 40px; border-radius: 10px; font-size: 13px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; flex-shrink: 0; }
  .conn__title { flex: 1; min-width: 0; }
  .conn__title b { font-size: 15px; }
  .conn .status { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: #eee; color: var(--muted); white-space: nowrap; }
  .conn .status.on { background: var(--soft); color: var(--green-d); }
  .conn .status.bad { background: #f6e3d6; color: var(--red); }
  .conn__body { margin-top: 12px; }
  .conn__body ul { margin: 6px 0 10px; padding-inline-start: 18px; }
  .conn__key { flex: 1; min-width: 220px; direction: ltr; text-align: left; }
  .conn small.help { display: block; color: var(--muted); margin-top: 6px; }
  .conn .num { width: 70px; }

  /* dashboard v2 */
  .periods { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .pp { border: 1px solid var(--line); background: #fff; padding: 7px 14px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .pp[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .kpi__top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .kpi__v { font-size: 30px; font-weight: 800; margin-top: 6px; line-height: 1.1; }
  .kpi__sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .d { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .d.up { background: #e4f1dc; color: #2f6b1a; } .d.down { background: #f8e4da; color: #a4561e; } .d.flat { background: #eee; color: var(--muted); }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; overflow: hidden; }
  .panel__head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .chart { display: flex; flex-direction: row-reverse; align-items: flex-end; gap: 4px; height: 170px; padding: 24px 16px 8px; }
  .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; min-width: 0; }
  .col__bar { background: var(--green); border-radius: 4px 4px 0 0; position: relative; max-width: 26px; margin: 0 auto; width: 100%; }
  .col__bar i { position: absolute; top: -17px; left: -10px; right: -10px; text-align: center; font-style: normal; font-size: 11px; color: var(--muted); }
  .col__lbl { height: 16px; font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; white-space: nowrap; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list li:last-child { border-bottom: 0; } .list li:hover { background: #faf9f6; }
  .pad { padding: 12px 16px; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; padding: 12px 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; color: var(--muted); }
  .strip b { color: var(--ink); }
  .kpi.skel { height: 104px; background: linear-gradient(90deg, #fff 0%, #f1efe9 50%, #fff 100%); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  .minis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .mini { padding: 12px 16px; border-left: 1px solid var(--line); }
  .mini:last-child { border-left: 0; }
  .mini__v { font-size: 24px; font-weight: 800; margin-top: 4px; }
  .two--flush { gap: 0; margin: 0; }
  .two--flush > div:first-child { border-left: 1px solid var(--line); }
  .panel__sub { padding: 10px 16px; font-size: 12px; font-weight: 700; color: var(--muted); background: #faf9f6; border-bottom: 1px solid var(--line); }
  @media (max-width: 800px) { .minis { grid-template-columns: 1fr 1fr; } .two--flush > div:first-child { border-left: 0; border-bottom: 1px solid var(--line); } }
  .potential { margin-top: 12px; padding: 12px 16px; border-radius: 12px; background: #fbf5e8; border: 1px dashed var(--beige); font-size: 13px; }
  @media (max-width: 800px) { .kpis { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { .detail { grid-template-columns: 1fr; } .v { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="dashboard" aria-selected="true">לוח בקרה</button>
    <button class="tab" role="tab" data-tab="members" aria-selected="false">חברים</button>
    <button class="tab" role="tab" data-tab="program" aria-selected="false">תוכנית</button>
    <button class="tab" role="tab" data-tab="campaigns" aria-selected="false">מבצעים</button>
    <button class="tab" role="tab" data-tab="design" aria-selected="false">עיצוב</button>
    <button class="tab" role="tab" data-tab="connections" aria-selected="false">חיבורים</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">הגדרות</button>
  </div>
  <main id="view"><p class="muted">טוען…</p></main>
</div>
<script>
  // Show any startup error on screen (helps when the page is opened from the Shopify mobile app).
  function hcShowError(msg) {
    if (window.hcPing) hcPing('error', String(msg).slice(0, 250));
    var v = document.getElementById('view');
    if (v) v.innerHTML = '<div class="card"><b>המסך לא נטען</b><p class="err" dir="ltr" style="text-align:left;word-break:break-word">' +
      String(msg).replace(/[<>&]/g, '') + '</p><p class="muted">צלמו את המסך ושלחו לקלוד.</p></div>';
  }
  window.addEventListener('error', function (e) { hcShowError(e.message || e); });
  window.addEventListener('unhandledrejection', function (e) { hcShowError((e.reason && (e.reason.message || e.reason)) || 'unknown'); });
  setTimeout(function () {
    var v = document.getElementById('view');
    if (window.hcNav) return; // the owner already moved to another screen, so the app is running
    if (v && /טוען/.test(v.textContent) && !v.querySelector('.kpi:not(.skel)')) {
      hcShowError('timeout · shopify=' + (typeof shopify) + ' · ua=' + navigator.userAgent.slice(0, 80) + ' · host=' + (new URLSearchParams(location.search).has('host')));
    }
  }, 15000);
</script>
<script>
(function () {
  var API = 'https://xblhodzcowleloqsveun.supabase.co/functions/v1/club-admin';
  var STORE = 'https://admin.shopify.com/store/happy-hempy';
  var TIER = { bronze: 'ארד', silver: 'כסף', gold: 'זהב', platinum: 'פלטינה' };
  var REASON = { join_bonus: 'מתנת הצטרפות', order_earn: 'קנייה', second_order_bonus: 'בונוס קנייה שנייה', tier_upgrade_bonus: 'מתנת דרגה',
    refund: 'החזרה', cancel: 'ביטול', redemption: 'מימוש', redemption_restored: 'קוד שלא נוצל', expiry: 'פג תוקף', manual_adjust: 'עדכון ידני',
    profile_bonus: 'השלמת פרופיל', review: 'ביקורת', referral: 'חבר מביא חבר', instagram: 'אינסטגרם' };
  var view = document.getElementById('view');
  // Each screen change bumps viewSeq; a response that arrives after the owner moved on is ignored.
  var viewSeq = 0;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nis(n) { return Math.round(Number(n) || 0).toLocaleString('he-IL') + ' ₪'; }
  function num(n) { return (Number(n) || 0).toLocaleString('he-IL'); }
  function day(d) { return d ? new Date(d).toLocaleDateString('he-IL') : '—'; }
  function tierPill(t, joined) { return joined === false ? '<span class="pill wait">עוד לא הצטרף/ה</span>' : '<span class="pill ' + esc(t) + '">' + esc(TIER[t] || t) + '</span>'; }

  async function api(action, params, body) {
    if (typeof shopify === 'undefined' || !shopify.idToken) throw new Error('App Bridge not available (shopify=' + typeof shopify + ')');
    var token = await shopify.idToken();
    if (!window.hcTokenOk && window.hcPing) { window.hcTokenOk = true; hcPing('token-ok'); }
    var qs = new URLSearchParams(Object.assign({ action: action }, params || {})).toString();
    var r = await fetch(API + '?' + qs, {
      method: body ? 'POST' : 'GET',
      headers: Object.assign({ Authorization: 'Bearer ' + token }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    var j = await r.json().catch(function () { return { ok: false, message: 'שגיאה' }; });
    if (!r.ok && !j.message) j.message = 'שגיאה ' + r.status;
    return j;
  }

  function card(k, v, sub, cls) { return '<div class="card ' + (cls || '') + '"><div class="k">' + k + '</div><div class="v">' + v + (sub ? ' <small>' + sub + '</small>' : '') + '</div></div>'; }

  // ---------- dashboard ----------
  var PERIODS = [
    { id: 'today', label: 'היום' }, { id: 'yesterday', label: 'אתמול' },
    { id: '7', label: '7 ימים' }, { id: '30', label: '30 ימים' }, { id: 'all', label: 'מתחילת המועדון' }
  ];
  var period = '7';
  function range(id) {
    var now = new Date(), start = new Date(now); start.setHours(0, 0, 0, 0);

      help: 'הגדרות ← API ← העתקת מפתח ה-API.',
      does: EMAIL_DOES.concat([EVENTS_LINE, 'שדות: club_points, club_tier, club_referral_url, club_points_expire']) },
    activetrail: { name: 'ActiveTrail', color: '#00a0df', letter: 'AT',
      fields: [{ id: 'key', label: 'API Token', secret: true }, { id: 'group_id', label: 'מספר קבוצה (Group ID)' }],
      help: 'הגדרות ← API Apps ← יצירת טוקן. מספר הקבוצה מופיע בכתובת של הקבוצה.',
      does: ['החברים נכנסים לקבוצה שבחרתם, בלי הרשמה לדיוור', 'השדות: ext21 = דרגה · ext22 = קישור חבר מביא חבר · num5 = יתרה · date5 = תפוגה'] },
    smoove: { name: 'Smoove', color: '#7b2ff7', letter: 'S',
      fields: [{ id: 'key', label: 'API Key', secret: true }, { id: 'list_id', label: 'מספר רשימה (לא חובה)', optional: true }],
      help: 'הגדרות ← API ← העתקת המפתח. צרו קודם שדות בשמות club_points, club_tier, club_referral_url, club_points_expire.',
      does: ['כל חבר מתעדכן כאיש קשר עם השדות שיצרתם', 'אם מילאתם מספר רשימה – החברים נכנסים אליה'] },
    inforu: { name: 'Inforu', color: '#e4002b', letter: 'IN',
      fields: [{ id: 'user', label: 'שם משתמש' }, { id: 'key', label: 'API Token', secret: true }],
      help: 'בממשק Inforu: הגדרות ← API ← טוקן.',
      does: ['החברים נכנסים לקבוצה "Declub"', 'השדות: Text20 = דרגה · Text21 = קישור חבר מביא חבר · Number4 = יתרה · Date8 = תפוגה'] },
    judgeme: { name: 'Judge.me', color: '#1fa9a1', letter: 'J', fields: [{ id: 'key', label: 'Private API Token', secret: true }],
      help: 'Settings ← Integrations ← View API tokens ← Private API Token.',
      does: ['חבר מועדון שכותב ביקורת מקבל נקודות (פעם אחת לכל מוצר)', 'ביקורת עם תמונה מקבלת תוספת', 'רק ביקורות שנכתבו אחרי החיבור. הנקודות לא תלויות בציון (כמו שהחוק דורש)'] },
    gorgias: { name: 'Gorgias', color: '#161616', letter: 'G', fields: [],
      help: 'לוחצים "חיבור", מעתיקים את הכתובת שתופיע, וב-Gorgias: Settings ← HTTP integration ← Add: Method GET, Trigger "Ticket created". אחר כך בפנייה: ⚙ ← Custom integrations.',
      does: ['בכל פנייה הנציג רואה: חבר/לא, יתרה, דרגה, תאריך תפוגה וקישור חבר מביא חבר'] },
    webhook: { name: 'Webhooks', color: '#47792b', letter: '↗', fields: [{ id: 'url', label: 'כתובת (https://...)' }],
      help: 'ב-Zapier: Webhooks by Zapier ← Catch Hook, מעתיקים את הכתובת לכאן. ב-Make: Custom webhook. נשלחת בדיקה בחיבור.',
      does: ['כל אירוע נשלח כ-POST עם JSON: topic, created_at, payload (כולל פרטי החבר)', 'חתימה: declub-signature = HMAC-SHA256 של "timestamp.body" עם המפתח הסודי'] }
  };
  async function connections() {
    view.innerHTML = '<p class="muted">טוען…</p>';
    var mySeq = viewSeq;
    var r = await api('integrations');
    if (mySeq !== viewSeq) return;
    if (!r.ok) { view.innerHTML = '<p class="err">' + esc(r.message) + '</p>'; return; }
    renderConnections(r.integrations || []);
  }
  function copyBtn(text) { return '<button class="tab" data-copy="' + esc(text) + '">העתקה</button>'; }
  function renderConnections(list) {
    var connectedN = list.filter(function (x) { return x.connected; }).length;
    view.innerHTML = '<p class="muted" style="margin-top:0">מחברים את הכלים שלכם, והמועדון מעדכן אותם לבד. המפתחות נשמרים בשרת ולא מוצגים שוב.' +
      (connectedN ? ' <b>' + connectedN + ' מחוברים.</b>' : '') + '</p>' +
      GROUPS.map(function (g) {
        var items = list.filter(function (x) { return x.kind === g.kind && TOOLS[x.provider]; });
        if (!items.length) return '';
        return '<h2>' + g.title + '</h2><p class="muted" style="margin-top:-6px">' + g.hint + '</p><div class="conn">' + items.map(connCard).join('') + '</div>';
      }).join('');
    view.querySelectorAll('[data-copy]').forEach(function (b) {
      b.onclick = function () {
        var t = b.getAttribute('data-copy');
        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { shopify.toast.show('הועתק'); },
          function () { window.prompt('העתיקו:', t); });
      };
    });
    view.querySelectorAll('[data-open]').forEach(function (b) {
      b.onclick = function () { var el = b.closest('[data-provider]'); el.querySelector('.conn__body').hidden = !el.querySelector('.conn__body').hidden; };
    });
    view.querySelectorAll('[data-provider]').forEach(function (el) {
      var provider = el.getAttribute('data-provider');
      var t = TOOLS[provider];
      function reviewSettings() {
        var a = el.querySelector('[data-rp]'), b = el.querySelector('[data-pp]');
        return a ? { review_points: Number(a.value), photo_points: Number(b.value) } : undefined;
      }
      var c = el.querySelector('[data-connect]');
      if (c) c.onclick = async function () {
        var fields = {}, missing = false;
        t.fields.forEach(function (f) {
          var v = el.querySelector('[data-f="' + f.id + '"]').value.trim();
          if (!v && !f.optional) missing = true;
          fields[f.id] = v;
        });
        if (missing) { shopify.toast.show('נא למלא את כל השדות', { isError: true }); return; }
        c.disabled = true; c.textContent = 'בודק…';
        var res = await api('integration_connect', {}, { provider: provider, fields: fields, settings: reviewSettings() });
        if (!res.ok) { c.disabled = false; c.textContent = 'חיבור'; shopify.toast.show(res.message || 'החיבור נכשל', { isError: true }); return; }
        shopify.toast.show(t.name + ' חובר');
        renderConnections(res.integrations);
      };
      var s = el.querySelector('[data-save]');
      if (s) s.onclick = async function () {
        var res = await api('integration_settings', {}, { provider: provider, settings: reviewSettings() });
        if (!res.ok) { shopify.toast.show('שגיאה', { isError: true }); return; }
        shopify.toast.show('נשמר');
        renderConnections(res.integrations);
      };
      var d = el.querySelector('[data-disconnect]');
      if (d) d.onclick = async function () {
        if (!confirm('לנתק את ' + t.name + '? המועדון יפסיק לעדכן אותו.')) return;
        var res = await api('integration_disconnect', {}, { provider: provider });
        if (!res.ok) { shopify.toast.show('שגיאה', { isError: true }); return; }
        shopify.toast.show(t.name + ' נותק');
        renderConnections(res.integrations);
      };
    });
  }
  function connCard(x) {
    var t = TOOLS[x.provider], dt = x.details || {};
    var status = !x.connected ? '<span class="status">לא מחובר</span>'
      : x.last_error ? '<span class="status bad">שגיאה</span>' : '<span class="status on">מחובר</span>';
    var body;
    if (!x.connected) {
      body = '<ul>' + t.does.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>' +
        '<div class="row-form">' + t.fields.map(function (f) {
          return '<input class="conn__key" ' + (f.secret ? 'type="password" autocomplete="off"' : 'type="text"') + ' spellcheck="false" placeholder="' + esc(f.label) + '" data-f="' + f.id + '">';
        }).join('') + (x.provider === 'judgeme' ? reviewInputs(x.settings) : '') +
        '<button class="primary" data-connect>חיבור</button></div><small class="help">' + esc(t.help) + '</small>';
    } else {
      var extra = [];
      if (dt.list_id) extra.push('קהל/רשימה: ' + esc(dt.list_id));
      if (dt.group_id) extra.push('קבוצה: ' + esc(dt.group_id));
      if (dt.user) extra.push('משתמש: ' + esc(dt.user));
      if (dt.url) extra.push('<span dir="ltr">' + esc(dt.url) + '</span>');
      if (dt.smoove_fields) extra.push(dt.smoove_fields.length ? 'שדות: ' + dt.smoove_fields.map(esc).join(', ') : 'לא נמצאו שדות club_* ב-Smoove');
      body = '<div class="muted">' + [esc(x.account || t.name), x.key_hint ? 'מפתח ' + esc(x.key_hint) : '', 'חובר ב-' + day(x.connected_at)].concat(extra).filter(Boolean).join(' · ') +
          (x.last_ok_at ? ' · עדכון אחרון ' + new Date(x.last_ok_at).toLocaleString('he-IL') : '') + '</div>' +
        (x.last_error ? '<p class="err" dir="ltr" style="text-align:left">' + esc(x.last_error) + '</p>' : '') +
        (dt.gorgias_url ? '<p>הכתובת להדבקה ב-Gorgias:</p><div class="row-form"><input class="conn__key" readonly value="' + esc(dt.gorgias_url) + '">' + copyBtn(dt.gorgias_url) + '</div><small class="help">' + esc(t.help) + '</small>' : '') +
        (dt.webhook_secret ? '<p>מפתח החתימה (לאימות אצלכם):</p><div class="row-form"><input class="conn__key" readonly type="password" value="' + esc(dt.webhook_secret) + '">' + copyBtn(dt.webhook_secret) + '</div>' : '') +
        (x.provider === 'judgeme'
          ? '<p>ביקורות שזיכו נקודות: <b>' + num(x.reviews_rewarded) + '</b> · סה״כ ' + nis(x.review_points_given) + '</p>' +
            '<div class="row-form">' + reviewInputs(x.settings) + '<button class="primary" data-save>שמירה</button></div>'
          : (x.events_waiting ? '<p class="muted">אירועים בתור לשליחה: ' + num(x.events_waiting) + '</p>' : '')) +
        '<div class="row-form"><button class="link" data-disconnect>ניתוק</button></div>';
    }
    return '<div class="card" data-provider="' + x.provider + '"><div class="conn__head"><div class="conn__logo" style="background:' + t.color + (t.ink ? ';color:' + t.ink : '') + '">' + t.letter +
      '</div><div class="conn__title"><b>' + t.name + '</b></div>' + status + (x.connected ? '' : '<button class="link" data-open>פרטים</button>') +
      '</div><div class="conn__body"' + (x.connected ? '' : ' hidden') + '>' + body + '</div></div>';
  }
  function reviewInputs(s) {
    s = s || {};
    return '<label>נקודות לביקורת <input class="num" type="number" min="0" max="100" data-rp value="' + esc(s.review_points == null ? 5 : s.review_points) + '"></label>' +
      '<label>תוספת לתמונה <input class="num" type="number" min="0" max="100" data-pp value="' + esc(s.photo_points == null ? 5 : s.photo_points) + '"></label>';
  }

  // ---------- tabs ----------
  function select(tab, silent) {
    viewSeq++;
    window.hcNav = true;
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    if (silent) return;
    if (tab === 'dashboard') dashboard();
    else if (tab === 'members') membersView();
    else if (tab === 'connections') connections();
    else if (tab === 'program') programView();
    else if (tab === 'campaigns') campaignsView();
    else if (tab === 'design') designView();
    else settings();
  }
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { select(b.getAttribute('data-tab')); }; });
  dashboard();
})();
</script>
</body>
</html>
