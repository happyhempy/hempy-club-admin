  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; overflow: hidden; }
  .panel__head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

  .col__bar { background: var(--green); border-radius: 4px 4px 0 0; position: relative; max-width: 26px; margin: 0 auto; width: 100%; }
  .col__bar i { position: absolute; top: -17px; left: -10px; right: -10px; text-align: center; font-style: normal; font-size: 11px; color: var(--muted); }
  .col__lbl { height: 16px; font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; white-space: nowrap; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list li:last-child { border-bottom: 0; } .list li:hover { background: #faf9f6; }
  .pad { padding: 12px 16px; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; padding: 12px 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; color: var(--muted); }
  .strip b { color: var(--ink); }
  .kpi.skel { height: 104px; background: linear-gradient(90deg, #fff 0%, #f1efe9 50%, #fff 100%); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  .minis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .mini { padding: 12px 16px; border-left: 1px solid var(--line); }

  @media (max-width: 800px) { .minis { grid-template-columns: 1fr 1fr; } .two--flush > div:first-child { border-left: 0; border-bottom: 1px solid var(--line); } }
  .potential { margin-top: 12px; padding: 12px 16px; border-radius: 12px; background: #fbf5e8; border: 1px dashed var(--beige); font-size: 13px; }
  @media (max-width: 800px) { .kpis { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { .detail { grid-template-columns: 1fr; } .v { font-size: 22px; } }

<body>
<div class="wrap">

</div>
<script>
  // Show any startup error on screen (helps when the page is opened from the Shopify mobile app).
  function hcShowError(msg) {
    if (window.hcPing) hcPing('error', String(msg).slice(0, 250));
    var v = document.getElementById('view');
    if (v) v.innerHTML = '<div class="card"><b>המסך לא נטען</b><p class="err" dir="ltr" style="text-align:left;word-break:break-word">' +
      String(msg).replace(/[<>&]/g, '') + '</p><p class="muted">צלמו את המסך ושלחו לקלוד.</p></div>';
  }
  window.addEventListener('error', function (e) { hcShowError(e.message || e); });
  window.addEventListener('unhandledrejection', function (e) { hcShowError((e.reason && (e.reason.message || e.reason)) || 'unknown'); });
  setTimeout(function () {
    var v = document.getElementById('view');
    if (window.hcNav) return; // the owner already moved to another screen, so the app is running
    if (v && /טוען/.test(v.textContent) && !v.querySelector('.kpi:not(.skel)')) {
      hcShowError('timeout · shopify=' + (typeof shopify) + ' · ua=' + navigator.userAgent.slice(0, 80) + ' · host=' + (new URLSearchParams(location.search).has('host')));
    }
  }, 15000);
</script>
<script>
(function () {
  var API = 'https://xblhodzcowleloqsveun.supabase.co/functions/v1/club-admin';
  var STORE = 'https://admin.shopify.com/store/happy-hempy';
  var TIER = { bronze: 'ארד', silver: 'כסף', gold: 'זהב', platinum: 'פלטינה' };
  var REASON = { join_bonus: 'מתנת הצטרפות', order_earn: 'קנייה', second_order_bonus: 'בונוס קנייה שנייה', tier_upgrade_bonus: 'מתנת דרגה',
    refund: 'החזרה', cancel: 'ביטול', redemption: 'מימוש', redemption_restored: 'קוד שלא נוצל', expiry: 'פג תוקף', manual_adjust: 'עדכון ידני',
    profile_bonus: 'השלמת פרופיל', review: 'ביקורת', referral: 'חבר מביא חבר', instagram: 'אינסטגרם' };
  var view = document.getElementById('view');
  // Each screen change bumps viewSeq; a response that arrives after the owner moved on is ignored.
  var viewSeq = 0;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nis(n) { return Math.round(Number(n) || 0).toLocaleString('he-IL') + ' ₪'; }
  function num(n) { return (Number(n) || 0).toLocaleString('he-IL'); }
  function day(d) { return d ? new Date(d).toLocaleDateString('he-IL') : '—'; }
  function tierPill(t, joined) { return joined === false ? '<span class="pill wait">עוד לא הצטרף/ה</span>' : '<span class="pill ' + esc(t) + '">' + esc(TIER[t] || t) + '</span>'; }

  async function api(action, params, body) {
    if (typeof shopify === 'undefined' || !shopify.idToken) throw new Error('App Bridge not available (shopify=' + typeof shopify + ')');
    var token = await shopify.idToken();
    if (!window.hcTokenOk && window.hcPing) { window.hcTokenOk = true; hcPing('token-ok'); }
    var qs = new URLSearchParams(Object.assign({ action: action }, params || {})).toString();
    var r = await fetch(API + '?' + qs, {
      method: body ? 'POST' : 'GET',
      headers: Object.assign({ Authorization: 'Bearer ' + token }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    var j = await r.json().catch(function () { return { ok: false, message: 'שגיאה' }; });
    if (!r.ok && !j.message) j.message = 'שגיאה ' + r.status;
    return j;
  }

  function card(k, v, sub, cls) { return '<div class="card ' + (cls || '') + '"><div class="k">' + k + '</div><div class="v">' + v + (sub ? ' <small>' + sub + '</small>' : '') + '</div></div>'; }

  // ---------- dashboard ----------
  var PERIODS = [
    { id: 'today', label: 'היום' }, { id: 'yesterday', label: 'אתמול' }, { id: '7', label: 'שבוע אחורה' },
    { id: '30', label: 'חודש אחורה' }, { id: '90', label: '3 חודשים' }, { id: '365', label: 'שנה' },
    { id: 'all', label: 'מתחילת המועדון' }, { id: 'custom', label: 'תאריכים לבחירה…' }
  ];
  var period = '7';
  var custom = { from: '', to: '' };
  try { var savedP = JSON.parse(localStorage.getItem('declub-period') || 'null'); if (savedP) { period = savedP.period; custom = savedP.custom || custom; } } catch (e) {}
  var CLUB_START = new Date('2026-10-22T00:00:00+03:00');
  function ymdLocal(d) { var x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); }
  function range(id) {
    var now = new Date(), start = new Date(now); start.setHours(0, 0, 0, 0);
    var back = function (days) { var a = new Date(start); a.setDate(a.getDate() - (days - 1)); return [a, now]; };
    if (id === 'today') return [start, now];
    if (id === 'yesterday') { var y = new Date(start); y.setDate(y.getDate() - 1); return [y, start]; }
    if (id === '7' || id === '30' || id === '90' || id === '365') return back(Number(id));
    if (id === 'custom' && custom.from && custom.to) {
      var f = new Date(custom.from + 'T00:00:00'), t = new Date(custom.to + 'T00:00:00'); t.setDate(t.getDate() + 1);
      if (t > f) return [f, t > now ? now : t];
    }
    return [CLUB_START, now];
  }
  function rangeLabel(rg) {
    var o = { day: 'numeric', month: 'short', year: 'numeric' };
    var end = new Date(rg[1].getTime() - 1000);
    return rg[0].toLocaleDateString('he-IL', o) + (ymdLocal(rg[0]) === ymdLocal(end) ? '' : ' – ' + end.toLocaleDateString('he-IL', o));
  }
  function delta(cur, prev) {
    if (period === 'all' || range(period)[0] <= CLUB_START) return '';
    if (!prev && !cur) return '<span class="d flat">—</span>';
    if (!prev) return '<span class="d up">חדש</span>';
    var p = Math.round(((cur - prev) / prev) * 100);
    return '<span class="d ' + (p > 0 ? 'up' : p < 0 ? 'down' : 'flat') + '">' + (p > 0 ? '▲ ' : p < 0 ? '▼ ' : '') + Math.abs(p) + '%</span>';
  }
  function kpi(label, value, d, sub) {
    return '<div class="kpi"><div class="kpi__top"><span class="k">' + label + '</span>' + (d || '') + '</div><div class="kpi__v">' + value + '</div>' +
      (sub ? '<div class="kpi__sub">' + sub + '</div>' : '') + '</div>';
  }
  function chart(daily, key, fmt) {
    var max = Math.max.apply(null, daily.map(function (x) { return Number(x[key]) || 0; }).concat([1]));
    var every = Math.max(1, Math.ceil(daily.length / 7));
    return '<div class="chart">' + daily.map(function (x, i) {
      var v = Number(x[key]) || 0;
      var dd = new Date(x.day + 'T12:00:00');
      var lbl = (i % every === every - 1 || i === daily.length - 1) ? dd.getDate() + '.' + (dd.getMonth() + 1) : '';
      var tip = dd.toLocaleDateString('he-IL') + (x.to && x.to !== x.day ? '–' + new Date(x.to + 'T12:00:00').toLocaleDateString('he-IL') : '');
      return '<div class="col" title="' + tip + ': ' + fmt(v) + '"><div class="col__bar" style="height:' + Math.max(2, Math.round((v / max) * 100)) + '%">' +
        (v ? '<i>' + (key === 'revenue' ? Math.round(v) : v) + '</i>' : '') + '</div><div class="col__lbl">' + lbl + '</div></div>';
    }).join('') + '</div>';
  }
  var chartKey = 'joined';
  var dashSeq = 0;

  async function dashboard() {
    var rg0 = range(period);
    var pills = '<div class="periods">' + PERIODS.map(function (p) {
      return '<button class="pp" data-p="' + p.id + '" aria-pressed="' + (p.id === period) + '">' + p.label + '</button>';
    }).join('') + '</div>' +
      (period === 'custom'
        ? '<div class="rangebar"><label for="range-from">מ-</label><input type="date" id="range-from" value="' + esc(custom.from) + '" min="2024-01-01" max="' + ymdLocal(new Date()) + '">' +
          '<label for="range-to">עד</label><input type="date" id="range-to" value="' + esc(custom.to) + '" min="2024-01-01" max="' + ymdLocal(new Date()) + '">' +
          '<button class="primary" data-range-go>הצגה</button></div>'
        : '') +
      '<p class="rangelbl">' + rangeLabel(rg0) + (period !== 'all' && rg0[0] > CLUB_START ? ' · בהשוואה לתקופה שלפני' : '') + '</p>';
    view.innerHTML = pills + '<div class="kpis">' + [1, 2, 3, 4].map(function () { return '<div class="kpi skel"></div>'; }).join('') + '</div>';
    bindPeriods();
    var my = ++dashSeq;
    var rg = range(period);
    var mySeq = viewSeq;
    var r = await api('stats', { from: rg[0].toISOString(), to: rg[1].toISOString() });
    if (mySeq !== viewSeq) return;
    if (my !== dashSeq) return; // a newer period was picked while this one loaded
    if (!r.ok) { view.innerHTML = pills + '<p class="err">' + esc(r.message) + '</p>'; bindPeriods(); return; }
    var c = r.stats.current, p = r.stats.previous, t = r.stats.totals, tiers = t.tiers || {};
    var aov = c.orders ? c.revenue / c.orders : 0;
    var roi = c.redeemed ? c.revenue / c.redeemed : 0;
    var rate = c.earned ? Math.round((c.redeemed / c.earned) * 100) : 0;
    view.innerHTML = pills +
      '<div class="kpis">' +
        kpi('הצטרפו למועדון', num(c.joined), delta(c.joined, p.joined), 'סה״כ ' + num(t.members) + ' חברים') +
        kpi('הכנסה מחברי מועדון', nis(c.revenue), delta(c.revenue, p.revenue), num(c.orders) + ' הזמנות · ממוצע ' + nis(aov)) +
        kpi('נקודות שמומשו', nis(c.redeemed), delta(c.redeemed, p.redeemed), num(c.redemptions) + ' הזמנות עם נקודות') +
        kpi('החזר על כל ₪ הנחה', roi ? roi.toFixed(1) + ' ₪' : '—', '', 'הכנסה מחברים ÷ נקודות שמומשו') +
      '</div>' +
      (r.stats.expiring && (r.stats.expiring.members || r.stats.expiring.pending)
        ? '<div class="card expwarn">⏳ <b>יפוגו ב-30 הימים הקרובים:</b> ' +
          [r.stats.expiring.members ? '<b>' + num(r.stats.expiring.members) + ' חברים</b> עם ' + nis(r.stats.expiring.points) : '',
           r.stats.expiring.pending ? '<b>' + num(r.stats.expiring.pending) + ' לקוחות שקנו ועוד לא הצטרפו</b> עם ' + nis(r.stats.expiring.pending_points) + ' שנשמרו להם' : ''].filter(Boolean).join(' · ') +
          '. <span class="muted">לחברים המועדון מזכיר באתר, בעגלה ובכלי המייל המחוברים. ב-Shopify Messaging אפשר לשלוח קמפיין לפי השדה "מועדון: הנקודות פגות ב".</span></div>'
        : '') +
      '<div class="panel">' +
        '<div class="panel__head"><b>' + (r.stats.bucket_days === 7 ? 'לפי שבועות' : 'לפי ימים') + ' · ' + rangeLabel(rg) + '</b><div class="seg">' +
          '<button data-c="joined" aria-pressed="' + (chartKey === 'joined') + '">הצטרפויות</button>' +
          '<button data-c="revenue" aria-pressed="' + (chartKey === 'revenue') + '">הכנסה מחברים</button></div></div>' +
        chart(r.stats.daily, chartKey, chartKey === 'revenue' ? nis : num) +
      '</div>' +
      '<div class="two">' +
        '<div class="panel"><div class="panel__head"><b>הצטרפו לאחרונה</b></div>' +
          (r.stats.recent_joins.length ? '<ul class="list">' + r.stats.recent_joins.map(function (m) {
            return '<li class="row" data-id="' + esc(m.id) + '"><span><b>' + esc(((m.first_name || '') + ' ' + (m.last_name || '')).trim()) + '</b> ' + tierPill(m.tier) +

          }).join('') + '</ul>' : '<p class="muted pad">עוד אין.</p>') + '</div>' +

            return '<li class="row" data-id="' + esc(x.id) + '"><span><b>' + esc(((x.first_name || '') + ' ' + (x.last_name || '')).trim()) + '</b> <span class="muted">' + esc(x.order_name || '') +

      '</div>' +

        '<span>יתרות פתוחות של חברים: <b>' + nis(t.balance_members) + '</b></span>' +

    bindRows();
  }
  function referralPanel(rf) {
    var SRC = { whatsapp: '💬 וואטסאפ', copy: '🔗 קישור' };
    var mini = function (k, v, sub) { return '<div class="mini"><div class="k">' + k + '</div><div class="mini__v">' + v + '</div>' + (sub ? '<div class="kpi__sub">' + sub + '</div>' : '') + '</div>'; };
    return '<div class="panel"><div class="panel__head"><b>🎁 חבר מביא חבר</b><span class="muted">בתקופה שנבחרה</span></div>' +

        mini('שיתופים בוואטסאפ', num(rf.shares_whatsapp), num(rf.sharers) + ' חברים שיתפו') +

        mini('חברים שהצטרפו דרך חבר', num(rf.joined), 'מוואטסאפ ' + num(rf.joined_whatsapp) + ' · מקישור ' + num(rf.joined_copy)) +
        mini('חברים חדשים שקנו', num(rf.bought), 'מי שהזמין קיבל 20 ₪') +
      '</div>' +
      '<div class="two two--flush">' +
        '<div><div class="panel__sub">הצטרפו דרך חבר</div>' +

          (x.last_ok_at ? ' · עדכון אחרון ' + new Date(x.last_ok_at).toLocaleString('he-IL') : '') + '</div>' +
        (x.last_error ? '<p class="err" dir="ltr" style="text-align:left">' + esc(x.last_error) + '</p>' : '') +
        (dt.gorgias_url ? '<p>הכתובת להדבקה ב-Gorgias:</p><div class="row-form"><input class="conn__key" readonly value="' + esc(dt.gorgias_url) + '">' + copyBtn(dt.gorgias_url) + '</div><small class="help">' + esc(t.help) + '</small>' : '') +
        (dt.webhook_secret ? '<p>מפתח החתימה (לאימות אצלכם):</p><div class="row-form"><input class="conn__key" readonly type="password" value="' + esc(dt.webhook_secret) + '">' + copyBtn(dt.webhook_secret) + '</div>' : '') +
        (x.provider === 'judgeme'
          ? '<p>ביקורות שזיכו נקודות: <b>' + num(x.reviews_rewarded) + '</b> · סה״כ ' + nis(x.review_points_given) + '</p>' +
            '<div class="row-form">' + reviewInputs(x.settings) + '<button class="primary" data-save>שמירה</button></div>'
          : (x.events_waiting ? '<p class="muted">אירועים בתור לשליחה: ' + num(x.events_waiting) + '</p>' : '')) +
        '<div class="row-form"><button class="link" data-disconnect>ניתוק</button></div>';
    }
    return '<div class="card" data-provider="' + x.provider + '"><div class="conn__head"><div class="conn__logo" style="background:' + t.color + (t.ink ? ';color:' + t.ink : '') + '">' + t.letter +
      '</div><div class="conn__title"><b>' + t.name + '</b></div>' + status + (x.connected ? '' : '<button class="link" data-open>פרטים</button>') +
      '</div><div class="conn__body"' + (x.connected ? '' : ' hidden') + '>' + body + '</div></div>';
  }
  function reviewInputs(s) {
    s = s || {};
    return '<label>נקודות לביקורת <input class="num" type="number" min="0" max="100" data-rp value="' + esc(s.review_points == null ? 5 : s.review_points) + '"></label>' +
      '<label>תוספת לתמונה <input class="num" type="number" min="0" max="100" data-pp value="' + esc(s.photo_points == null ? 5 : s.photo_points) + '"></label>';
  }

  // ---------- tabs ----------
  function select(tab, silent) {
    viewSeq++;
    window.hcNav = true;
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    if (silent) return;
    if (tab === 'dashboard') dashboard();
    else if (tab === 'members') membersView();
    else if (tab === 'connections') connections();
    else if (tab === 'program') programView();
    else if (tab === 'campaigns') campaignsView();
    else if (tab === 'design') designView();
    else settings();
  }
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { select(b.getAttribute('data-tab')); }; });
  dashboard();
})();
</script>
</body>
</html>
